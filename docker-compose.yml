services:
  cloudgamecatalog.api:
    image: ${DOCKER_REGISTRY-}cloudgamecatalogapi
    build:
      context: .
      dockerfile: ./src/CloudGameCatalog.Api/Dockerfile
    user: "root"
    ports:
      - '57398:8080'
      - '57399:8081'
    environment:
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false      
      - ASPNETCORE_ENVIRONMENT=Docker
      - DOTNET_ENVIRONMENT=Docker      
    volumes:
    - ./src/CloudGameCatalog.Api/Logs:/app/Logs
    restart: unless-stopped    
    networks:
      - cloudgame-network

  cloudgamecatalog.consumer:
    image: ${DOCKER_REGISTRY-}cloudgamecatalogconsumer
    build:
      context: .
      dockerfile: ./src/CloudGameCatalog.Consumer/Dockerfile
    user: "root"
    environment:
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - ASPNETCORE_ENVIRONMENT=Docker
      - DOTNET_ENVIRONMENT=Docker      
    volumes:
    - ./src/CloudGameCatalog.Consumer/Logs:/app/Logs
    restart: unless-stopped        
    networks:
      - cloudgame-network  

  redis:
    image: redis:7-alpine
    container_name: cloudgame-redis
    ports:
      - "6379:6379"
    networks:
      - cloudgame-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: cloudgame-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - cloudgame-network

volumes:
  elasticsearch-data:

networks:
  cloudgame-network:
    external: true
    name: cloudgame-network